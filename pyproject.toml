[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "psa-sniper-free"
version = "1.0.0"
description = "Systematic eBay PSA 10 low-pop scanner with encrypted GitHub Pages dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "cryptography>=43,<48",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ocr = [
  "Pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
psa-sniper = "psa_sniper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

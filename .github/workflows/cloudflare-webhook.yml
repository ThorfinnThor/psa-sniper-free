name: Deploy eBay Webhook to Cloudflare

# Triggered after webhook secrets are configured.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "cloudflare/ebay-webhook/**"
      - ".github/workflows/cloudflare-webhook.yml"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EBAY_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
          EBAY_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: |
          missing=()
          [[ -n "$CF_ACCOUNT" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [[ -n "$CF_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$EBAY_TOKEN" ]] || missing+=(EBAY_VERIFICATION_TOKEN)
          [[ -n "$EBAY_ID" ]] || missing+=(EBAY_CLIENT_ID)
          [[ -n "$EBAY_SECRET" ]] || missing+=(EBAY_CLIENT_SECRET)
          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All required webhook secrets are configured."
            echo "All required webhook secrets are configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Missing repository secrets: ${missing[*]}"
            echo "### Missing repository secrets" >> "$GITHUB_STEP_SUMMARY"
            for name in "${missing[@]}"; do
              echo "- $name" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "Only secret names are reported; values are never printed." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Worker unit tests
        working-directory: cloudflare/ebay-webhook
        run: npm test

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/ebay-webhook
          wranglerVersion: "4"
          command: deploy
          secrets: |
            EBAY_VERIFICATION_TOKEN
            EBAY_CLIENT_ID
            EBAY_CLIENT_SECRET
        env:
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

      - name: Live endpoint smoke test
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          EBAY_VERIFICATION_TOKEN: ${{ secrets.EBAY_VERIFICATION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          endpoint="$base/api/ebay-account-deletion"
          challenge="github-smoke-test"
          challenge_url="$endpoint?challenge_code=$challenge"

          code=$(curl -sS -L -D /tmp/cf_headers.txt -o /tmp/cf_body.txt -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H 'User-Agent: PSA-Sniper-GitHub-Smoke-Test/1.0' \
            "$challenge_url" || true)

          if [[ "$code" != "200" ]]; then
            echo "Cloudflare live challenge returned HTTP $code"
            echo "--- response headers ---"
            sed -n '1,40p' /tmp/cf_headers.txt
            echo "--- response body (first 2000 bytes) ---"
            head -c 2000 /tmp/cf_body.txt || true
            echo
            exit 1
          fi

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          base = os.environ["DEPLOYMENT_URL"].rstrip("/")
          endpoint = base + "/api/ebay-account-deletion"
          token = os.environ["EBAY_VERIFICATION_TOKEN"]
          challenge = "github-smoke-test"
          expected = hashlib.sha256((challenge + token + endpoint).encode()).hexdigest()
          body = json.loads(Path("/tmp/cf_body.txt").read_text())
          assert body.get("challengeResponse") == expected, "challenge hash mismatch"
          PY

          payload='{"metadata":{"topic":"MARKETPLACE_ACCOUNT_DELETION","schemaVersion":"1.0","deprecated":false},"notification":{"notificationId":"github-smoke-test","eventDate":"2026-08-27T00:00:00Z","publishDate":"2026-08-27T00:00:00Z","publishAttemptCount":1,"data":{"username":"redacted","userId":"redacted","eiasToken":"redacted"}}}'
          post_code=$(curl -sS -L -o /tmp/cf_post_body.txt -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: PSA-Sniper-GitHub-Smoke-Test/1.0' \
            --data "$payload" "$endpoint" || true)

          if [[ "$post_code" != "200" ]]; then
            echo "Cloudflare live POST returned HTTP $post_code"
            head -c 2000 /tmp/cf_post_body.txt || true
            echo
            exit 1
          fi

          echo "Live GET challenge and POST acknowledgement both passed."

      - name: Endpoint ausgeben
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          base="${DEPLOYMENT_URL%/}"
          {
            echo "## eBay Cloudflare Webhook deployed"
            echo
            echo "Notification Endpoint:"
            echo '```text'
            echo "$base/api/ebay-account-deletion"
            echo '```'
            echo
            echo "Live smoke test: GET challenge + POST acknowledgement passed."
            echo
            echo "Use the same value stored in GitHub secret EBAY_VERIFICATION_TOKEN in the eBay developer portal."
          } >> "$GITHUB_STEP_SUMMARY"

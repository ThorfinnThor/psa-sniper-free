name: PSA Token Check

on:
  push:
    branches: ["audit-v2-20260829"]
    paths:
      - ".github/workflows/psa-token-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PSA_ACCESS_TOKEN: ${{ secrets.PSA_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-v2-20260829
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: PSA Access Token live prüfen
        shell: bash
        run: |
          python - <<'PY'
          import os
          from psa_sniper.psa import PSAClient
          from psa_sniper.psa_auth import normalize_psa_access_token

          client = PSAClient(
              access_token=normalize_psa_access_token(os.getenv("PSA_ACCESS_TOKEN")),
              web_fallback=False,
              delay_seconds=0,
              max_calls=1,
          )
          status = client.validate_access_token()
          print(f"PSA_TOKEN_STATUS={status.upper()}")
          if status != "ok":
              raise SystemExit(2)
          PY

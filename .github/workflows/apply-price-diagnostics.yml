name: Apply Price Diagnostics Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-price-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preisdiagnose einbauen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_price_diag_patch.py
          python -m compileall -q psa_sniper
          python -m pytest -q
          node --check site/template/app.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add psa_sniper/scanner.py psa_sniper/dashboard.py tests/test_scanner_market.py tests/test_crypto_dashboard.py
          git commit -m "Add price coverage loss diagnostics"
          git push origin HEAD:main

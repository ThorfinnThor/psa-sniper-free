name: Apply Audit V2 Safety

on:
  push:
    branches: ["audit-v2-20260829"]
    paths:
      - ".github/workflows/audit-v2-apply.yml"
      - "scripts/apply_audit_v2_safety.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-v2-20260829
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Sicherheits-Fixes anwenden und testen
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_audit_v2_safety.py
          pytest -q
          python -m compileall -q psa_sniper
          node --check site/template/app.js
          python -m psa_sniper demo --output site/dist
          (cd cloudflare/ebay-webhook && npm test)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            psa_sniper/psa.py \
            psa_sniper/scoring.py \
            psa_sniper/scanner.py \
            psa_sniper/live_check.py \
            psa_sniper/repricing.py \
            psa_sniper/psa_backfill.py \
            psa_sniper/state.py \
            config/settings.json \
            tests/test_scoring.py \
            tests/test_alert_rearm.py \
            tests/test_psa_backfill.py \
            tests/test_quality_config.py
          git commit -m "Add import-risk gates and alert rearming"
          git push origin HEAD:audit-v2-20260829

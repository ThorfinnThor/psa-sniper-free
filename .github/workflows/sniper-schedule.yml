name: PSA Sniper Scheduler

on:
  schedule:
    # Minimaler GitHub-nativer Heartbeat; der Scanner-Core begrenzt echte Scans auf ~3 Stunden.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sniper-schedule.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: PSA Sniper automatisch starten
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          in_progress="$(gh api "/repos/$REPO/actions/workflows/sniper.yml/runs?status=in_progress&per_page=1" --jq '.total_count // 0')"
          queued="$(gh api "/repos/$REPO/actions/workflows/sniper.yml/runs?status=queued&per_page=1" --jq '.total_count // 0')"
          if (( in_progress > 0 || queued > 0 )); then
            echo "Scanner läuft bereits oder ist queued; kein doppelter Dispatch."
            exit 0
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$REPO/actions/workflows/sniper.yml/dispatches" \
            -f ref=main \
            -f 'inputs[automated]=true'
          echo "Scanner per workflow_dispatch angefordert."

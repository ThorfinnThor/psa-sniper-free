name: Install PSA Sniper

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release-Archiv rekonstruieren
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/payload.part.* > /tmp/psa_sniper.b64
          base64 --decode /tmp/psa_sniper.b64 > /tmp/psa_sniper.zip
          echo "0f80dab859bdb8bccb3dc4f0fc649477602f9d5eb3ff5d7ca18ea7f900ce9869  /tmp/psa_sniper.zip" | sha256sum -c -
          mkdir -p /tmp/release
          unzip -q /tmp/psa_sniper.zip -d /tmp/release
          test -f /tmp/release/psa_sniper_free_v1.0.0/README.md
          test -f /tmp/release/psa_sniper_free_v1.0.0/.github/workflows/sniper.yml

      - name: Projekt installieren
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/release/psa_sniper_free_v1.0.0/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          chmod +x scripts/persist_state.sh scripts/restore_state.sh

      - name: Projektstruktur prüfen
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q psa_sniper
          python - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path("config/searches.json").read_text())
          json.loads(Path("config/settings.json").read_text())
          required = [
              Path("README.md"),
              Path("psa_sniper/scanner.py"),
              Path("site/template/index.html"),
              Path(".github/workflows/sniper.yml"),
              Path(".github/workflows/tests.yml"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit(f"Fehlende Projektdateien: {missing}")
          print("Projektstruktur verifiziert")
          PY

      - name: Installation committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install PSA Sniper Free 1.0.0"
          git push origin HEAD:main

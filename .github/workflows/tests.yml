name: Tests

on:
  push:
    branches-ignore: ["sniper-state"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check psa_sniper
      - run: pytest -q
      - run: python -m compileall -q psa_sniper
      - run: node --check site/template/app.js
      - name: Cloudflare webhook tests
        working-directory: cloudflare/ebay-webhook
        run: npm test
      - name: Demo-Dashboard bauen
        run: python -m psa_sniper demo --output site/dist
